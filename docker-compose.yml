services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: split_the_bill
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build: .
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      FASTAPI_API_KEY: dev-only-change-me
      JWT_SECRET: dev-only-change-me-dev-only-change-me
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/split_the_bill
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  db_data:
